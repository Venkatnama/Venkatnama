<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .drive{animation:drive 7s linear infinite}
  @keyframes drive{from{transform:translateX(-120px)}to{transform:translateX(1260px)}}
  .dash{stroke:#555;stroke-width:2;stroke-dasharray:24 18;animation:d .8s linear infinite}
  @keyframes d{to{stroke-dashoffset:-42}}
  .beam{animation:b 1s ease-in-out infinite alternate}
  @keyframes b{from{opacity:.5}to{opacity:1}}
</style>
<defs><linearGradient id="bm" x1="0" x2="1"><stop offset="0" stop-color="#fff6d6" stop-opacity=".8"/><stop offset="1" stop-color="#fff6d6" stop-opacity="0"/></linearGradient></defs>
<line x1="0" y1="46" x2="1200" y2="46" stroke="#e00000" stroke-width="1" opacity=".6"/>
<line class="dash" x1="0" y1="54" x2="1200" y2="54"/>
<g class="drive">
  <g transform="translate(0,45) scale(.12) translate(-330,-325)">
    <polygon class="beam" points="896,226 1200,190 1200,290 896,236" fill="url(#bm)"/>
    <path d="M330 282 L330 228 Q330 213 346 209 L420 197 L470 152 Q478 143 492 143 L760 143 Q775 143 785 153 L830 200 L882 212 Q900 217 900 236 L900 282 Z" fill="#1a1a1c" stroke="#e00000" stroke-width="6"/>
    <path d="M492 196 L522 158 L748 158 L798 196 Z" fill="#0c1a22"/>
    <rect x="330" y="224" width="9" height="26" fill="#ff1a1a"/>
    <circle cx="440" cy="285" r="40" fill="#0d0d0d" stroke="#e00000" stroke-width="8"/>
    <circle cx="790" cy="285" r="40" fill="#0d0d0d" stroke="#e00000" stroke-width="8"/>
  </g>
</g>
</svg>
